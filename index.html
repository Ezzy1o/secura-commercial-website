<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SECURA — Secure Web Platform for AI Document Anonymization</title>
    <meta
      name="description"
      content="SECURA is a secure web platform for automated AI document anonymization, helping organizations protect sensitive information while enabling safe cross-department collaboration."
    />
    <meta property="og:title" content="SECURA — AI Document Anonymization" />
    <meta
      property="og:description"
      content="A secure web platform for automated AI document anonymization and controlled cross-department collaboration."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#2d0878" />
    <link rel="icon" href="/favicon.svg" />
    <script>
      // Prevent theme flash: apply stored/system theme before first paint.
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem("secura-theme")
        } catch (e) {}
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
